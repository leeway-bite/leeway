<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Critical Mobile Viewport Tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Disable auto-formatting for telephone numbers -->
  <meta name="format-detection" content="telephone=no">
  <title>ChatGPT Mobile</title>
  <style>
    /* Mobile-First CSS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* Removes touch highlight */
    }
    
    body {
      background: linear-gradient(to right, #00a67e, #008080);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      touch-action: manipulation; /* Optimizes touch delays */
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      text-align: center;
    }
    
    p {
      font-size: 1rem;
      margin-bottom: 25px;
      text-align: center;
    }
    
    button {
      background-color: #ffffff;
      color: #00a67e;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 300px;
    }
    
    button:active {
      background-color: #00d6a3;
      color: #fff;
      transform: scale(0.98); /* Tactile feedback */
    }
    
    /* Prevent zooming on input focus */
    @media screen and (max-width: 480px) {
      input, textarea, select {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body>
  <h1>Smart Chat</h1>
  <p>Tap below to start chatting with ChatGPT</p>

  <button onclick="openChatGPT()">Start Chatting</button>

  <script>
    // Mobile-optimized click handler
    function openChatGPT() {
      // Uses '_self' instead of '_blank' for better mobile behavior
      window.location.href = 'https://chat.openai.com/';
    }
    
    // Prevent accidental zooming on double-tap
    document.addEventListener('dblclick', function(e) {
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
