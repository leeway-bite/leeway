<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f6f2e7;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: #fdfbf6;
            padding: 20px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-style: italic;
        }
        .date-section input {
            border: none;
            border-bottom: 1px solid #aaa;
            background: transparent;
            font-size: 16px;
            margin: 0 10px;
            width: 100px;
            text-align: center;
        }
        .planner-section {
            display: flex;
            justify-content: space-between;
            text-align: left;
        }
        .schedule, .tasks {
            width: 48%;
        }
        .schedule div, .tasks div {
            padding: 5px;
            border-bottom: 1px solid #ddd;
        }
        .tasks input[type="text"] {
            margin-right: 10px;
        }
        .checklists-confirmation {
            margin-top: 10px;
        }
        .footer-buttons {
            margin-top: 20px;
        }
        .footer-buttons button {
            border: none;
            background: none;
            font-size: 14px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Planner</h1>
        <div class="date-section">
            <input type="text" placeholder="Day"> /
            <input type="text" placeholder="Month"> /
            <input type="text" placeholder="Year">
        </div>
        <div class="planner-section">
            <div class="schedule">
                <h3>Today's Schedule</h3>
                <div>05:00 <input type="text" placeholder="Task"></div>
                <div>06:00 <input type="text" placeholder="Task"></div>
                <div>07:00 <input type="text" placeholder="Task"></div>
                <div>08:00 <input type="text" placeholder="Task"></div>
                <div>09:00 <input type="text" placeholder="Task"></div>
                <div>10:00 <input type="text" placeholder="Task"></div>
                <div>11:00 <input type="text" placeholder="Task"></div>
                <div>12:00 <input type="text" placeholder="Task"></div>
                <div>01:00 <input type="text" placeholder="task"></div>
                <div>02:00 <input type="text" placeholder="task"></div>
                <div>03:00 <input type="text" placeholder="task"></div>
              <div>04:00 <input type="text" placeholder="task"></div>
              <div>05:00 <input type="text" placeholder="task"></div>
              <div>06:00 <input type="text" placeholder="task"></div>
              <div>07:00 <input type="text" placeholder="task"></div>
              <div>08:00 <input type="text" placeholder="task"></div>
              <div>09:00 <input type="text" placeholder="task"></div>
            </div>
            <div class="tasks">
                <h3>Top Priorities of the Day</h3>
                <div>Task 1 <input type="text"> </div>
                <div>Task 2 <input type="text"></div>
                <div>Task 3 <input type="text"></div>
    
                <h3>Checklists comfirmation</h3>
                <div class="water-intake">
                    <input type="checkbox"> 1
                    <input type="checkbox"> 2
                    <input type="checkbox"> 3
                </div>
                <h3>Checklists</h3>
                <div>Check 1 <input type="text"> </div>
                <div>Check 2 <input type="text"> </div>
                <div>Check 3 <input type="text"> </div>
                <h3>WORK REPORT</h3>
                <input type="text" placeholder="One thing that made you happy today">
        </div>

    </div>
</body>
</html>
